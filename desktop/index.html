<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall - AI Learning Companion</title>
    <!-- Add KaTeX CSS from CDN to guarantee it loads and isn't purged/mangled by Tailwind/Vite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <!-- Google Fonts for authentic student handwritten notebook aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var pre = document.createElement('pre');
        pre.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:black;color:red;z-index:9999;padding:20px;white-space:pre-wrap;';
        pre.textContent = "Global Error: " + e.message + "\n\n" + e.filename + ":" + e.lineno + "\n\n" + (e.error ? e.error.stack : "");
        document.body.appendChild(pre);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var pre = document.createElement('pre');
        pre.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:black;color:red;z-index:9999;padding:20px;white-space:pre-wrap;';
        pre.textContent = "Unhandled Promise Rejection: " + (e.reason ? (e.reason.stack || e.reason) : "Unknown reason");
        document.body.appendChild(pre);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
