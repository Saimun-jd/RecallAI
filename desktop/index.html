<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall - AI Learning Companion</title>
    <!-- Add KaTeX CSS from CDN to guarantee it loads and isn't purged/mangled by Tailwind/Vite -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsRQOikO3OiwVlz-99hQ25i5VygL2a7Qc6p1/9/M9T1tqR6g800m+45U9C" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var pre = document.createElement('pre');
        pre.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:black;color:red;z-index:9999;padding:20px;white-space:pre-wrap;';
        pre.textContent = "Global Error: " + e.message + "\n\n" + e.filename + ":" + e.lineno + "\n\n" + (e.error ? e.error.stack : "");
        document.body.appendChild(pre);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var pre = document.createElement('pre');
        pre.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:black;color:red;z-index:9999;padding:20px;white-space:pre-wrap;';
        pre.textContent = "Unhandled Promise Rejection: " + (e.reason ? (e.reason.stack || e.reason) : "Unknown reason");
        document.body.appendChild(pre);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
