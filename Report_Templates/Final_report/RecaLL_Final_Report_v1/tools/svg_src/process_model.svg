<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 890" width="1000" height="890" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="890" fill="#ffffff"/>

  <!-- Group: the cycle repeated in every increment -->
  <rect x="40" y="20" width="920" height="150" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="60" y="48" font-size="18" font-weight="600" fill="#555555">Repeated in every increment</text>

  <path d="M270,92 H306" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M490,92 H526" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,92 H746" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M840,122 V140 Q840,152 828,152 H182 Q170,152 170,140 V126" stroke="#000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <rect x="90" y="62" width="180" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="180" y="100" font-size="22" text-anchor="middle">Plan</text>
  <rect x="310" y="62" width="180" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="400" y="100" font-size="22" text-anchor="middle">Build</text>
  <rect x="530" y="62" width="180" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="620" y="100" font-size="22" text-anchor="middle">Test</text>
  <rect x="750" y="62" width="180" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="840" y="100" font-size="22" text-anchor="middle">Commit, merge</text>

  <!-- Staircase of increments: arrows first -->
  <path d="M410,276 V294" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M470,374 V392" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M530,472 V490" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M590,570 V588" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M650,668 V686" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M710,766 V784" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Dates (2026) -->
  <g font-size="18" text-anchor="end" fill="#000">
    <text x="156" y="244">22–24 Jul</text>
    <text x="216" y="342">5 Aug</text>
    <text x="276" y="440">19–25 Aug</text>
    <text x="336" y="538">26 Aug–9 Sep</text>
    <text x="396" y="636">12–21 Sep</text>
    <text x="456" y="734">25–29 Sep</text>
    <text x="516" y="832">5 Nov</text>
  </g>

  <!-- Increments -->
  <g font-size="22" text-anchor="middle" fill="#000">
    <rect x="170" y="200" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="380" y="246">1 · CLI extraction prototype</text>
    <rect x="230" y="298" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="440" y="344">2 · Desktop app and notes</text>
    <rect x="290" y="396" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="500" y="442">3 · Socratic drill, first release</text>
    <rect x="350" y="494" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="560" y="540">4 · Cloud login, OCR, AI chat</text>
    <rect x="410" y="592" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="620" y="638">5 · Study API, quizzes, FSRS</text>
    <rect x="470" y="690" width="420" height="76" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="680" y="736">6 · Hardening and CI</text>
    <rect x="530" y="788" width="420" height="76" rx="10" fill="#000" stroke="#000" stroke-width="2"/>
    <text x="740" y="834" font-weight="700" fill="#fff">7 · Review fixes, PR merge</text>
  </g>
</svg>
