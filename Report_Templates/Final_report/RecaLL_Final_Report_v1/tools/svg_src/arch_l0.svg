<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="610" fill="#ffffff"/>

  <!-- Group: the packaged Tauri app -->
  <rect x="20" y="20" width="660" height="570" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="40" y="50" font-size="18" font-weight="600" fill="#555555">Tauri desktop app</text>

  <!-- Arrows -->
  <path d="M340,150 V196" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,280 V326" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,410 V450" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M170,450 H490" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M170,450 V486" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M490,450 V486" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M620,530 H736" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- Shapes -->
  <rect x="190" y="70" width="300" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="118" font-size="22" text-anchor="middle" fill="#000000">React user interface</text>

  <rect x="190" y="200" width="300" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="248" font-size="22" text-anchor="middle" fill="#000000">FastAPI route layer</text>

  <rect x="190" y="330" width="300" height="80" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="340" y="378" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Service layer</text>

  <rect x="40" y="490" width="260" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="170" y="538" font-size="22" text-anchor="middle" fill="#000000">Local storage</text>

  <rect x="360" y="490" width="260" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="490" y="538" font-size="22" text-anchor="middle" fill="#000000">AI provider layer</text>

  <rect x="740" y="490" width="200" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="840" y="538" font-size="22" text-anchor="middle" fill="#000000">LLM services</text>
</svg>
