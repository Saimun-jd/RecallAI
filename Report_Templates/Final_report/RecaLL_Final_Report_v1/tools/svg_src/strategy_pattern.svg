<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="gen" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L13,7 L1,13 z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="850" fill="#ffffff"/>

  <!-- ===== Panel 1: LLM provider strategy ===== -->
  <rect x="10" y="10" width="940" height="440" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="26" y="38" font-size="18" font-weight="600" fill="#555555">LLM provider strategy</text>

  <!-- relations -->
  <path d="M330,115 H418" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#open)"/>
  <text x="374" y="103" font-size="18" text-anchor="middle" fill="#000000">«create»</text>
  <path d="M390,260 V220 H810 V260" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M600,260 V220" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M600,220 V182" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#gen)"/>
  <path d="M600,370 V322" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#gen)"/>

  <!-- factory -->
  <rect x="40" y="75" width="290" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="185" y="105" font-size="18" text-anchor="middle" fill="#000000">«factory function»</text>
  <text x="185" y="135" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">get_llm_provider()</text>

  <!-- abstract base -->
  <rect x="420" y="50" width="360" height="130" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="74" font-size="18" text-anchor="middle" fill="#000000">«abstract»</text>
  <text x="600" y="100" font-size="20" font-weight="700" font-style="italic" text-anchor="middle" fill="#000000">BaseLLMProvider</text>
  <path d="M420,110 H780" stroke="#000000" stroke-width="1.5"/>
  <text x="436" y="138" font-size="18" fill="#000000" font-style="italic">+ generate(prompt, json_schema)</text>
  <text x="436" y="166" font-size="18" fill="#000000" font-style="italic">+ generate_stream(prompt)</text>

  <!-- concrete strategies -->
  <rect x="295" y="262" width="190" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="390" y="299" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">GeminiProvider</text>
  <rect x="505" y="262" width="190" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="299" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">OpenAIProvider</text>
  <rect x="715" y="262" width="190" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="810" y="299" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">OllamaProvider</text>
  <rect x="505" y="372" width="190" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="600" y="409" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">GroqProvider</text>

  <!-- ===== Panel 2: extractor registry ===== -->
  <rect x="10" y="480" width="940" height="350" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="26" y="508" font-size="18" font-weight="600" fill="#555555">Extractor plugin registry</text>

  <!-- relations -->
  <path d="M360,595 H438" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#open)"/>
  <text x="426" y="584" font-size="18" text-anchor="end" fill="#000000">0..*</text>
  <path d="M340,740 V700 H820 V740" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M585,740 V700" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M620,700 V662" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#gen)"/>

  <!-- registry module -->
  <rect x="40" y="530" width="320" height="160" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="200" y="554" font-size="18" text-anchor="middle" fill="#000000">«module»</text>
  <text x="200" y="580" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">extractors.registry</text>
  <path d="M40,590 H360" stroke="#000000" stroke-width="1.5"/>
  <text x="56" y="618" font-size="18" fill="#000000">+ register_extractor(cls)</text>
  <text x="56" y="646" font-size="18" fill="#000000">+ discover_extractors()</text>
  <text x="56" y="674" font-size="18" fill="#000000">+ get_extractor(name)</text>

  <!-- abstract base -->
  <rect x="440" y="530" width="360" height="130" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="620" y="554" font-size="18" text-anchor="middle" fill="#000000">«abstract»</text>
  <text x="620" y="580" font-size="20" font-weight="700" font-style="italic" text-anchor="middle" fill="#000000">BaseExtractor</text>
  <path d="M440,590 H800" stroke="#000000" stroke-width="1.5"/>
  <text x="456" y="618" font-size="18" fill="#000000" font-style="italic">+ extract(pdf_path, output_dir)</text>
  <text x="456" y="646" font-size="18" fill="#000000" font-style="italic">+ is_available()</text>

  <!-- concrete plugins -->
  <rect x="220" y="742" width="240" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="779" font-size="19" font-weight="700" text-anchor="middle" fill="#000000">PyMuPDF4LLMExtractor</text>
  <rect x="490" y="742" width="190" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="585" y="779" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">MarkerExtractor</text>
  <rect x="710" y="742" width="220" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="820" y="779" font-size="20" font-weight="700" text-anchor="middle" fill="#000000">MarkerApiExtractor</text>
</svg>
