<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="850" fill="#ffffff"/>

  <!-- Layer groups -->
  <rect x="20" y="10" width="920" height="120" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="34" font-size="18" font-weight="600" fill="#555555">Desktop UI</text>
  <rect x="20" y="170" width="920" height="120" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="194" font-size="18" font-weight="600" fill="#555555">API layer</text>
  <rect x="20" y="330" width="920" height="120" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="354" font-size="18" font-weight="600" fill="#555555">Service layer</text>
  <rect x="20" y="490" width="440" height="230" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="36" y="514" font-size="18" font-weight="600" fill="#555555">AI layer</text>
  <rect x="500" y="490" width="440" height="320" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="516" y="514" font-size="18" font-weight="600" fill="#555555">Storage layer</text>

  <!-- Arrows -->
  <path d="M440,82 H516" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M480,130 V166" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M480,290 V326" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M240,450 V486" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,450 V486" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M240,720 V756" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- Desktop UI -->
  <rect x="140" y="47" width="300" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="290" y="89" font-size="20" text-anchor="middle" fill="#000000">React views and store</text>
  <rect x="520" y="47" width="300" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="670" y="89" font-size="20" text-anchor="middle" fill="#000000">API client</text>

  <!-- API layer -->
  <rect x="140" y="207" width="300" height="70" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="290" y="249" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">v1 API routes</text>
  <rect x="520" y="207" width="300" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="670" y="249" font-size="20" text-anchor="middle" fill="#000000">Legacy study routes</text>

  <!-- Service layer -->
  <rect x="35" y="367" width="205" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="137" y="409" font-size="20" text-anchor="middle" fill="#000000">Document pipeline</text>
  <rect x="265" y="367" width="205" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="367" y="409" font-size="20" text-anchor="middle" fill="#000000">RAG and retrieval</text>
  <rect x="495" y="367" width="205" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="597" y="409" font-size="20" text-anchor="middle" fill="#000000">Study and review</text>
  <rect x="725" y="367" width="205" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="827" y="409" font-size="20" text-anchor="middle" fill="#000000">Legacy study logic</text>

  <!-- AI layer -->
  <rect x="60" y="527" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="240" y="569" font-size="20" text-anchor="middle" fill="#000000">AI service adapters</text>
  <rect x="60" y="627" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="240" y="669" font-size="20" text-anchor="middle" fill="#000000">LLM provider factory</text>

  <!-- External -->
  <rect x="60" y="760" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="240" y="802" font-size="20" text-anchor="middle" fill="#000000">External LLM APIs</text>

  <!-- Storage layer -->
  <rect x="540" y="527" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="720" y="569" font-size="20" text-anchor="middle" fill="#000000">SaaS database</text>
  <rect x="540" y="622" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="720" y="664" font-size="20" text-anchor="middle" fill="#000000">Per-user study database</text>
  <rect x="540" y="717" width="360" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="720" y="759" font-size="20" text-anchor="middle" fill="#000000">Local file storage</text>
</svg>
