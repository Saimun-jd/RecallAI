<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="390" fill="#ffffff"/>

  <!-- Group: the student's computer -->
  <rect x="200" y="20" width="520" height="350" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="220" y="50" font-size="18" font-weight="600" fill="#555555">Student's computer</text>

  <!-- Arrows -->
  <path d="M180,115 H216" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M440,115 H476" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M700,115 H756" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <path d="M590,160 V210" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M330,210 H590" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M330,210 V256" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M590,210 V256" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M590,210 H838 Q850,210 850,222 V256" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- Row 1 -->
  <rect x="20" y="70" width="160" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="100" y="123" font-size="22" text-anchor="middle" fill="#000000">Student</text>

  <rect x="220" y="70" width="220" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="330" y="123" font-size="22" text-anchor="middle" fill="#000000">Desktop app</text>

  <rect x="480" y="70" width="220" height="90" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="590" y="123" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Local backend API</text>

  <rect x="760" y="70" width="180" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="850" y="123" font-size="22" text-anchor="middle" fill="#000000">AI providers</text>

  <!-- Row 2 -->
  <rect x="220" y="260" width="220" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="330" y="313" font-size="22" text-anchor="middle" fill="#000000">Local databases</text>

  <rect x="480" y="260" width="220" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="590" y="313" font-size="22" text-anchor="middle" fill="#000000">File storage</text>

  <rect x="760" y="260" width="180" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="850" y="313" font-size="22" text-anchor="middle" fill="#000000">Cloud sync</text>
</svg>
