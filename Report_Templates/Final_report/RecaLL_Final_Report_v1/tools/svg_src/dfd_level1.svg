<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 960" width="1640" height="960" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1640" height="960" fill="#ffffff"/>
  <g font-size="14" fill="#000000">
    <rect x="1240" y="20" width="370" height="120" rx="8" fill="#ffffff" stroke="#000000"/>
    <rect x="1256" y="36" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="1286" y="49">external entity</text>
    <circle cx="1440" cy="44" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="1458" y="49">process</text>
    <circle cx="1267" cy="74" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="1286" y="79">data store (D1–D5)</text>
    <line x1="1256" y1="102" x2="1304" y2="102" stroke="#000000" stroke-width="2.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="1314" y="107">data both ways</text>
    <line x1="1440" y1="102" x2="1488" y2="102" stroke="#000000" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1498" y="107">read only</text>
    <line x1="1256" y1="126" x2="1304" y2="126" stroke="#000000" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1314" y="131">write / send</text>
  </g>

  <!-- ===== Flows ===== -->
  <g fill="none" stroke="#000000" stroke-width="2.4">
    <!-- student bus -->
    <path d="M680,232 V290"/>
    <path d="M160,290 H1240"/>
    <path d="M160,290 V360" marker-end="url(#arrow)"/>
    <path d="M430,290 V360" marker-end="url(#arrow)"/>
    <path d="M700,290 V360" marker-end="url(#arrow)"/>
    <path d="M970,290 V360" marker-end="url(#arrow)"/>
    <path d="M1240,290 V360" marker-end="url(#arrow)"/>
    <!-- billing <-> P1 -->
    <path d="M110,234 V376" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- process <-> store verticals -->
    <path d="M160,522 V714" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M430,522 V714" marker-end="url(#arrow)"/>
    <path d="M700,522 V714" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M970,522 V714" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M1240,522 V714" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- P2 -> D4 legacy: book + topics, routed under the stores -->
    <path d="M374,492 Q345,505 345,530 V900 Q345,912 357,912 H958 Q970,912 970,900 V866" marker-end="url(#arrow)"/>
    <!-- D2 -> P3 chunks (read) -->
    <path d="M481,739 L643,497" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <!-- P4 review <-> D5 sessions -->
    <path d="M1025,495 L1187,737" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- P5 generate -> D4 legacy: drills, topic cards -->
    <path d="M1185,495 L1023,737" marker-end="url(#arrow)"/>
    <!-- P5 <-> AI -->
    <path d="M1320,440 H1416" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <!-- P3 <-> AI over the top -->
    <path d="M755,383 V345 H1520 V386" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <g font-size="14" fill="#000000">
    <text x="168" y="322">login / token</text>
    <text x="438" y="322">file / status</text>
    <text x="708" y="322">question / answer</text>
    <text x="978" y="322">rating / next card</text>
    <text x="1248" y="322">request / cards, quiz, grade</text>
    <text x="118" y="264">checkout / webhook</text>
    <text x="168" y="622">user, plan, usage</text>
    <text x="438" y="622">file, chunks</text>
    <text x="708" y="622">messages</text>
    <text x="978" y="610">card state</text>
    <text x="1248" y="622">sets, quizzes</text>
    <text x="560" y="932" text-anchor="middle">book + topics (PDF uploads)</text>
    <text x="548" y="600" text-anchor="end">chunks</text>
    <text x="980" y="548">sessions</text>
    <text x="1105" y="772" text-anchor="middle">drills,</text>
    <text x="1105" y="790" text-anchor="middle">topic cards</text>
    <text x="1368" y="428" text-anchor="middle">prompt / text</text>
    <text x="862" y="338" text-anchor="middle">prompt + chunks / answer</text>
  </g>

  <!-- ===== Externals ===== -->
  <rect x="40" y="150" width="240" height="82" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="160" y="186" font-size="19" font-weight="700">Billing provider</text>
    <text x="160" y="212" font-size="14">mock Stripe</text>
  </g>
  <rect x="540" y="150" width="280" height="82" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="680" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#000000">Student</text>
  <rect x="1420" y="390" width="200" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="1520" y="432" font-size="19" font-weight="700">AI provider</text>
    <text x="1520" y="458" font-size="14">Gemini · OpenAI · Groq</text>
    <text x="1520" y="476" font-size="14">OpenRouter · Ollama</text>
  </g>

  <!-- ===== Processes ===== -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <circle cx="160" cy="440" r="78"/>
    <circle cx="430" cy="440" r="78"/>
    <circle cx="700" cy="440" r="78"/>
    <circle cx="970" cy="440" r="78"/>
    <circle cx="1240" cy="440" r="78"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="160" y="418" font-size="14" fill="#000000">1.0</text>
    <text x="160" y="443" font-size="17" font-weight="700">Authenticate</text>
    <text x="160" y="465" font-size="15">&amp; manage plan</text>
    <text x="430" y="418" font-size="14" fill="#000000">2.0</text>
    <text x="430" y="443" font-size="17" font-weight="700">Ingest</text>
    <text x="430" y="465" font-size="15">document</text>
    <text x="700" y="418" font-size="14" fill="#000000">3.0</text>
    <text x="700" y="443" font-size="17" font-weight="700">Answer</text>
    <text x="700" y="465" font-size="15">questions</text>
    <text x="970" y="418" font-size="14" fill="#000000">4.0</text>
    <text x="970" y="443" font-size="17" font-weight="700">Review</text>
    <text x="970" y="465" font-size="15">cards (FSRS)</text>
    <text x="1240" y="418" font-size="14" fill="#000000">5.0</text>
    <text x="1240" y="443" font-size="17" font-weight="700">Generate study</text>
    <text x="1240" y="465" font-size="15">material</text>
  </g>

  <!-- ===== Data stores ===== -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <circle cx="160" cy="790" r="72"/>
    <circle cx="430" cy="790" r="72"/>
    <circle cx="700" cy="790" r="72"/>
    <circle cx="970" cy="790" r="72"/>
    <circle cx="1240" cy="790" r="72"/>
  </g>
  <g text-anchor="middle" fill="#000000">
    <text x="160" y="784" font-size="16" font-weight="700">D1 Accounts</text>
    <text x="160" y="806" font-size="12">users, plans, usage</text>
    <text x="430" y="784" font-size="16" font-weight="700">D2 Documents</text>
    <text x="430" y="806" font-size="12">files, chunks</text>
    <text x="700" y="784" font-size="15" font-weight="700">D3 Conversations</text>
    <text x="700" y="806" font-size="12">messages, sources</text>
    <text x="970" y="778" font-size="15" font-weight="700">D4 Legacy study</text>
    <text x="970" y="800" font-size="12">books, topics, notes,</text>
    <text x="970" y="816" font-size="12">cards, drills (recall.db)</text>
    <text x="1240" y="784" font-size="15" font-weight="700">D5 Study records</text>
    <text x="1240" y="806" font-size="12">sets, quizzes, sessions</text>
  </g>
</svg>
