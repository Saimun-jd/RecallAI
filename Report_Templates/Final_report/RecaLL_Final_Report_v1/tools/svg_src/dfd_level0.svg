    <path d="M671,540 H344" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M969,470 H1296" marker-end="url(#arrow)"/>
    <path d="M1298,540 H971" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M780,351 V268" marker-end="url(#arrow)"/>
    <path d="M860,268 V351" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M745,630 L642,754" marker-end="url(#arrow)"/>
    <path d="M560,756 L712,608" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <path d="M895,630 L998,754" marker-end="url(#arrow)"/>
    <path d="M1080,756 L928,608" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>
  <g font-size="15" fill="#000000">
    <text x="506" y="458" text-anchor="middle">PDFs, questions, typed answers, ratings</text>
    <text x="506" y="562" text-anchor="middle">answers, flashcards, quizzes, scores, progress</text>
    <text x="1132" y="458" text-anchor="middle">prompts + document text</text>
    <text x="1132" y="562" text-anchor="middle">generated text / JSON</text>
    <text x="770" y="315" text-anchor="end">push local changes</text>
    <text x="870" y="315">pull changes, login token</text>
    <text x="706" y="710">checkout request</text>
    <text x="626" y="676" text-anchor="end">webhook (payment event)</text>
    <text x="934" y="710" text-anchor="end">scanned pages</text>
    <text x="1016" y="676">extracted markdown</text>
  </g>

  <circle cx="820" cy="500" r="150" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="820" y="470" font-size="18" fill="#000000">0</text>
    <text x="820" y="505" font-size="28" font-weight="700">Recall AI</text>
    <text x="820" y="535" font-size="16" fill="#000000">study assistant</text>
  </g>

  <rect x="80" y="430" width="260" height="150" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="210" y="498" font-size="22" font-weight="700">Student</text>
    <text x="210" y="526" font-size="15">desktop app user</text>
  </g>
  <rect x="1300" y="430" width="260" height="150" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="1430" y="490" font-size="22" font-weight="700">AI provider</text>
    <text x="1430" y="518" font-size="15">Gemini · OpenAI · Groq</text>
    <text x="1430" y="540" font-size="15">OpenRouter · local Ollama</text>
  </g>
  <rect x="690" y="150" width="260" height="116" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
