  </g>
  <rect x="940" y="758" width="280" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <g text-anchor="middle" fill="#000000">
    <text x="1080" y="806" font-size="22" font-weight="700">OCR service</text>
    <text x="1080" y="834" font-size="15">Marker / Datalab</text>
