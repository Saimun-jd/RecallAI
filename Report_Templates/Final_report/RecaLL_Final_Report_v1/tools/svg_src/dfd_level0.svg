<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 920" width="1640" height="920" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1640" height="920" fill="#ffffff"/>
  <g font-size="14" fill="#000000">
    <rect x="1240" y="24" width="370" height="104" rx="8" fill="#ffffff" stroke="#000000"/>
    <rect x="1258" y="42" width="22" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="1290" y="55">external entity</text>
    <circle cx="1430" cy="50" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/><text x="1448" y="55">process</text>
    <line x1="1258" y1="80" x2="1306" y2="80" stroke="#000000" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="1316" y="85">data flow: request / data sent</text>
    <line x1="1258" y1="108" x2="1306" y2="108" stroke="#000000" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1316" y="113">data flow: reply / data returned</text>
  </g>

  <g fill="none" stroke="#000000" stroke-width="2.4">
