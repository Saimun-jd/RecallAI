<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1100" width="960" height="1100" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="1100" fill="#ffffff"/>

  <!-- Group: background job -->
  <rect x="10" y="110" width="660" height="860" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="30" y="138" font-size="18" font-weight="600" fill="#555555">Background job</text>

  <!-- Arrows -->
  <path d="M340,90 V146" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,220 V256" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,330 V366" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,440 V476" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,550 V586" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M200,650 H182 Q170,650 170,662 V746" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M480,650 H498 Q510,650 510,662 V746" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M170,820 V850" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M510,820 V850" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M170,850 H510" stroke="#000000" stroke-width="2" fill="none"/>
  <path d="M340,850 V876" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M340,950 V1006" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M670,515 H756" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="182" y="712" font-size="20" font-weight="600" fill="#000000">Yes</text>
  <text x="498" y="712" font-size="20" font-weight="600" text-anchor="end" fill="#000000">No</text>
  <text x="713" y="503" font-size="18" text-anchor="middle" fill="#000000">Any error</text>

  <!-- Steps -->
  <rect x="150" y="20" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="63" font-size="22" text-anchor="middle" fill="#000000">Upload saved, job queued</text>

  <rect x="150" y="150" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="193" font-size="22" text-anchor="middle" fill="#000000">Validate file signature</text>

  <rect x="150" y="260" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="303" font-size="22" text-anchor="middle" fill="#000000">Extract text per page</text>

  <rect x="150" y="370" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="413" font-size="22" text-anchor="middle" fill="#000000">Normalize the text</text>

  <rect x="150" y="480" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="523" font-size="22" text-anchor="middle" fill="#000000">Split into overlapping chunks</text>

  <!-- Decision -->
  <path d="M340,590 L480,650 L340,710 L200,650 Z" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
  <text x="340" y="658" font-size="21" text-anchor="middle" fill="#000000">Embedding key set?</text>

  <rect x="30" y="750" width="280" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="170" y="792" font-size="20" text-anchor="middle" fill="#000000">Provider embedding API</text>

  <rect x="370" y="750" width="280" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="510" y="792" font-size="20" text-anchor="middle" fill="#000000">Hash placeholder vectors</text>

  <rect x="150" y="880" width="380" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="340" y="923" font-size="22" text-anchor="middle" fill="#000000">Save chunks with vectors</text>

  <!-- Failure path -->
  <rect x="760" y="480" width="180" height="70" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="850" y="522" font-size="20" text-anchor="middle" fill="#000000">Mark job failed</text>

  <!-- Result -->
  <rect x="150" y="1010" width="380" height="70" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="340" y="1053" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">Document marked ready</text>
</svg>
