<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="770" fill="#ffffff"/>

  <!-- Groups -->
  <rect x="30" y="112" width="630" height="640" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="50" y="738" font-size="18" font-weight="600" fill="#555555">CI workflow · Ubuntu runners</text>
  <rect x="680" y="112" width="290" height="640" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="696" y="738" font-size="18" font-weight="600" fill="#555555">Release · Windows runner</text>

  <!-- Arrows first -->
  <!-- CI trigger fans out to both jobs -->
  <path d="M345,80 V96" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M175,96 H495" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M175,96 V151" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M495,96 V151" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- backend job -->
  <path d="M175,215 V241" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M175,305 V331" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- frontend job -->
  <path d="M495,215 V241" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M495,305 V331" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M495,395 V421" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M495,485 V511" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- jobs meet -->
  <path d="M175,395 V620" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M495,575 V620" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M175,620 H495" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M335,620 V646" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- release job -->
  <path d="M825,80 V151" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,215 V241" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,305 V331" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,395 V421" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,485 V511" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M825,575 V601" stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Triggers -->
  <g font-size="20" text-anchor="middle" fill="#000">
    <rect x="200" y="20" width="290" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="345" y="57">Push or PR to main</text>
    <rect x="695" y="20" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="57">Push a v* tag</text>
  </g>

  <!-- Steps -->
  <g font-size="20" text-anchor="middle" fill="#000">
    <!-- backend -->
    <rect x="45" y="155" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="175" y="192">Set up Python 3.12</text>
    <rect x="45" y="245" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="175" y="282">Install requirements</text>
    <rect x="45" y="335" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="175" y="372">Run pytest suite</text>
    <!-- frontend -->
    <rect x="365" y="155" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="495" y="192">Set up pnpm, Node 20</text>
    <rect x="365" y="245" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="495" y="282">Install packages</text>
    <rect x="365" y="335" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="495" y="372">Lint with oxlint</text>
    <rect x="365" y="425" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="495" y="462">Type-check and build</text>
    <rect x="365" y="515" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="495" y="552">Playwright E2E tests</text>
    <!-- CI result -->
    <rect x="205" y="650" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="335" y="687">Pass or fail check</text>
    <!-- release -->
    <rect x="695" y="155" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="192">Set up Python 3.12</text>
    <rect x="695" y="245" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="282">Build backend sidecar</text>
    <rect x="695" y="335" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="372">Build React frontend</text>
    <rect x="695" y="425" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="462">Set up Rust</text>
    <rect x="695" y="515" width="260" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="825" y="552">Build Tauri installer</text>
    <rect x="695" y="605" width="260" height="60" rx="10" fill="#000" stroke="#000" stroke-width="2"/>
    <text x="825" y="642" font-weight="700" fill="#fff">Publish GitHub Release</text>
  </g>
</svg>
