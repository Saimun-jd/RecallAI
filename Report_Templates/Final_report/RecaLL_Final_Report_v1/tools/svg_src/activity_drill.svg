<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1110" width="1000" height="1110" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="1110" fill="#ffffff"/>

  <!-- Swimlanes -->
  <rect x="20" y="10" width="960" height="1090" fill="none" stroke="#7F7F7F" stroke-width="1.5"/>
  <rect x="20" y="10" width="960" height="44" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5"/>
  <path d="M250,10 V1100 M710,10 V1100" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#000">
    <text x="135" y="39">Student</text>
    <text x="480" y="39">Recall app</text>
    <text x="845" y="39">AI provider</text>
  </g>

  <!-- Arrows first -->
  <g stroke="#000" stroke-width="2" fill="none">
    <path d="M135,81 V96" marker-end="url(#arrow)"/>
    <path d="M230,130 H326" marker-end="url(#arrow)"/>
    <path d="M630,130 H731" marker-end="url(#arrow)"/>
    <path d="M845,160 V218 Q845,230 833,230 H624" marker-end="url(#arrow)"/>
    <!-- question generation failed -->
    <path d="M340,230 H234" marker-end="url(#arrow)"/>
    <path d="M135,260 V278" marker-end="url(#arrow)"/>
    <path d="M480,272 V306" marker-end="url(#arrow)"/>
    <path d="M330,340 H147 Q135,340 135,352 V406" marker-end="url(#arrow)"/>
    <path d="M230,440 H326" marker-end="url(#arrow)"/>
    <path d="M630,440 H731" marker-end="url(#arrow)"/>
    <path d="M845,470 V528 Q845,540 833,540 H624" marker-end="url(#arrow)"/>
    <!-- grading failed: back to answering -->
    <path d="M340,540 H234" marker-end="url(#arrow)"/>
    <path d="M135,510 V474" marker-end="url(#arrow)"/>
    <path d="M480,582 V616" marker-end="url(#arrow)"/>
    <path d="M480,680 V716" marker-end="url(#arrow)"/>
    <path d="M330,750 H147 Q135,750 135,762 V804" marker-end="url(#arrow)"/>
    <path d="M240,850 H326" marker-end="url(#arrow)"/>
    <path d="M480,880 V934" marker-end="url(#arrow)"/>
    <path d="M135,892 V898 Q135,910 147,910 H468 Q480,910 480,922"/>
    <!-- next question loop -->
    <path d="M620,980 H958 Q970,980 970,968 V302 Q970,290 958,290 H592 Q580,290 580,302 V306" marker-end="url(#arrow)"/>
    <path d="M480,1022 V1044" marker-end="url(#arrow)"/>
  </g>

  <!-- Branch labels -->
  <g font-size="18" font-weight="600" fill="#000">
    <text x="290" y="220" text-anchor="middle">No</text>
    <text x="492" y="296">Yes</text>
    <text x="290" y="530" text-anchor="middle">No</text>
    <text x="492" y="606">Yes</text>
    <text x="282" y="840" text-anchor="middle">Yes</text>
    <text x="100" y="906" text-anchor="middle">No</text>
    <text x="660" y="970" text-anchor="middle">Yes</text>
    <text x="492" y="1040">No</text>
  </g>

  <!-- Start and end nodes -->
  <circle cx="135" cy="70" r="11" fill="#000"/>
  <circle cx="135" cy="296" r="14" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="135" cy="296" r="8" fill="#000"/>
  <circle cx="480" cy="1062" r="14" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="480" cy="1062" r="8" fill="#000"/>

  <!-- Actions -->
  <g font-size="20" text-anchor="middle" fill="#000">
    <rect x="40" y="100" width="190" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="135" y="137">Start a drill</text>
    <rect x="330" y="100" width="300" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="137">Load the topic text</text>
    <rect x="735" y="100" width="220" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="845" y="137">Write two questions</text>
    <rect x="40" y="200" width="190" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="135" y="237">See error</text>
    <rect x="330" y="310" width="300" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="347">Show a question</text>
    <rect x="40" y="410" width="190" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="135" y="447">Type an answer</text>
    <rect x="330" y="410" width="300" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="447">Send answer to grade</text>
    <rect x="735" y="410" width="220" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="845" y="447">Score, find gaps</text>
    <rect x="40" y="510" width="190" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="135" y="547">See error, retry</text>
    <rect x="330" y="620" width="300" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="657">Save attempt, mastery</text>
    <rect x="330" y="720" width="300" height="60" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="480" y="757">Show score, gaps, cards</text>
    <rect x="330" y="820" width="300" height="60" rx="16" fill="#000" stroke="#000" stroke-width="2"/>
    <text x="480" y="857" font-weight="700" fill="#fff">Add cards to FSRS deck</text>
  </g>

  <!-- Decisions -->
  <g font-size="20" text-anchor="middle" fill="#000">
    <path d="M480,188 L620,230 L480,272 L340,230 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <text x="480" y="237">Valid JSON?</text>
    <path d="M480,498 L620,540 L480,582 L340,540 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <text x="480" y="547">Valid JSON?</text>
    <path d="M135,808 L240,850 L135,892 L30,850 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <text x="135" y="856" font-size="18">Save gap cards?</text>
    <path d="M480,938 L620,980 L480,1022 L340,980 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <text x="480" y="987">Next question?</text>
  </g>
</svg>
