  <path d="M720,250 V286" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,360 V396" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720,470 V646" stroke="#000000" stroke-width="2" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

