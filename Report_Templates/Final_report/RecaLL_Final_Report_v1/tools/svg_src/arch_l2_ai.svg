  <rect x="510" y="20" width="420" height="590" rx="10" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="530" y="50" font-size="18" font-weight="600" fill="#555555">v1 API services</text>

  <!-- Arrows -->
  <path d="M240,140 V176" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
