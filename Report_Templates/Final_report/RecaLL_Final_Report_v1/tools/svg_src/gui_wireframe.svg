  <rect x="142" y="672" width="361" height="12" rx="4" fill="#D9D9D9"/>
  <rect x="142" y="694" width="300" height="12" rx="4" fill="#D9D9D9"/>
  <rect x="142" y="716" width="330" height="12" rx="4" fill="#D9D9D9"/>

  <rect x="545" y="546" width="405" height="210" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
