    <rect x="567" y="650" width="361" height="40" rx="6"/>
    <rect x="567" y="700" width="361" height="40" rx="6"/>
  </g>
  <g font-size="18"><text x="583" y="626">Document title, status</text><text x="583" y="676">Document title, status</text><text x="583" y="726">Document title, status</text></g>

