  <rect x="142" y="834" width="360" height="12" rx="4" fill="#D9D9D9"/>
  <rect x="740" y="801" width="186" height="48" rx="8" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="833" y="832" font-size="20" text-anchor="middle">Resume Document</text>

  <!-- 6. Two columns -->
  <rect x="120" y="894" width="405" height="200" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="142" y="930" font-size="22" font-weight="700">Study Consistency</text>
  <g fill="#D9D9D9">
    <rect x="150" y="1020" width="34" height="50"/><rect x="200" y="990" width="34" height="80"/><rect x="250" y="1040" width="34" height="30"/>
    <rect x="300" y="1000" width="34" height="70"/><rect x="350" y="980" width="34" height="90"/><rect x="400" y="1030" width="34" height="40"/>
    <rect x="450" y="1010" width="34" height="60"/>
  </g>
  <rect x="545" y="894" width="405" height="200" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="567" y="930" font-size="22" font-weight="700">Plan and Usage</text>
  <text x="567" y="972" font-size="18" fill="#555555">AI credits</text>
  <rect x="567" y="984" width="361" height="16" rx="8" fill="#F2F2F2" stroke="#000" stroke-width="1"/>
  <rect x="567" y="984" width="150" height="16" rx="8" fill="#D9D9D9"/>
  <text x="567" y="1038" font-size="18" fill="#555555">Documents and storage</text>
  <rect x="567" y="1050" width="361" height="16" rx="8" fill="#F2F2F2" stroke="#000" stroke-width="1"/>
  <rect x="567" y="1050" width="90" height="16" rx="8" fill="#D9D9D9"/>
