    <rect x="333" y="400" width="191" height="120" rx="10"/>
    <rect x="546" y="400" width="191" height="120" rx="10"/>
    <rect x="759" y="400" width="191" height="120" rx="10"/>
  </g>
  <g fill="#D9D9D9">
