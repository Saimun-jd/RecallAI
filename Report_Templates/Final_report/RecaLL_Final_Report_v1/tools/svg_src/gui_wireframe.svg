    <rect x="40" y="156" width="30" height="30" rx="6"/>
    <rect x="40" y="208" width="30" height="30" rx="6"/>
    <rect x="40" y="260" width="30" height="30" rx="6"/>
    <rect x="40" y="330" width="30" height="30" rx="6"/>
    <rect x="40" y="382" width="30" height="30" rx="6"/>
    <rect x="40" y="434" width="30" height="30" rx="6"/>
    <rect x="40" y="504" width="30" height="30" rx="6"/>
    <rect x="40" y="574" width="30" height="30" rx="6"/>
    <rect x="40" y="1020" width="30" height="30" rx="6"/>
    <rect x="40" y="1068" width="30" height="30" rx="6"/>
