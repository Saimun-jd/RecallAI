<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1140" width="1000" height="1140" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="1140" fill="#ffffff"/>

  <!-- Window frame -->
  <rect x="20" y="20" width="960" height="1100" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>

