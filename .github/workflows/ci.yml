name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Pytest Test Suite
        env:
          TESTING: 'true'
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          python -m pytest app/tests -v --durations=10

  frontend-tests:
    name: Frontend Lint, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'desktop/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        working-directory: ./desktop
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint Linter
        working-directory: ./desktop
        run: pnpm run lint

      - name: Run TypeScript & Vite Build
        working-directory: ./desktop
        run: pnpm run build

      - name: Install Playwright Browsers
        working-directory: ./desktop
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E User Journeys
        working-directory: ./desktop
        env:
          CI: 'true'
          BASE_URL: 'http://127.0.0.1:4173'
        run: |
          pnpm run preview --port 4173 &
          python3 -c "import urllib.request, time; [time.sleep(1) for _ in range(30) if urllib.request.urlopen('http://127.0.0.1:4173').getcode() != 200]" || sleep 4
          pnpm run test:e2e
